<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Slideshow</title>
    <link rel="stylesheet" href="styleSlideShow.css">
    <script src="jquery-3.7.1.js"></script> <!-- Versi terbaru -->
    <style>
        #slider {
            padding: 10px 0;
            position: relative;
            width: 300px;
            height: 300px;
        }

        #slider img {
            width: 300px;
            height: 300px;
            position: absolute;
            border-radius: 5px;
        }

        .slidertitle {
            width: 280px;
            margin-top: 265px;
            text-align: center;
            position: absolute;
            padding: 10px;
            border-radius: 0px 0px 5px 5px;
            color: #FFF;
            background-color: rgba(12, 22, 23, 0.5);
        }
    </style>
    <script>
        $(document).ready(function () {
            var i = 0;

            // Sembunyikan semua elemen di awal
            $('.slidertitle, #slider img').hide();

            // Tampilkan gambar pertama
            showNextImage();

            // Jalankan otomatis setiap 3 detik
            setInterval(showNextImage, 3000);

            function showNextImage() {
                i++;
                $('#sliderImage' + i).appendTo('#slider').fadeIn(1100).delay(1100).fadeOut(1100);
                $('#title' + i).appendTo('#slider').fadeIn(1100).delay(1100).fadeOut(1100);

                if (i == 3) i = 0; // Reset ke gambar pertama
            }
        });
    </script>
</head>

<body>

    <div id="slider">
        <img id="sliderImage1" src="gambar1.jpg">
        <div class="slidertitle" id="title1">Gambar 1</div>

        <img id="sliderImage2" src="gambar2.jpg">
        <div class="slidertitle" id="title2">Gambar 2</div>

        <img id="sliderImage3" src="gambar3.jpg">
        <div class="slidertitle" id="title3">Gambar 3</div>
    </div>

</body>

</html>
