<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="jquery-3.7.1.js"></script>
    <style>
        div {
            width: 100px;
            height: 100px;
            margin: 10px;
            display: inline-block;
        }
        #div1 { background-color: red; }
        #div2 { background-color: green; }
        #div3 { background-color: blue; }
    </style>
    <script>
        $(document).ready(function () {
            // Tombol sembunyikan
            $(".tombol1").click(function () {
                $("div").hide();
            });

            // Tombol tampilkan
            $(".tombol2").click(function () {
                $("div").show();
            });

            // Fade out
            $(".tombol3").click(function () {
                $("#div1").fadeOut();
                $("#div2").fadeOut("slow");
                $("#div3").fadeOut(3000);
            });

            // Fade in
            $(".tombol4").click(function () {
                $("#div1").fadeIn();
                $("#div2").fadeIn("slow");
                $("#div3").fadeIn(3000);
            });

            // Fade to (atur opacity)
            $(".tombol5").click(function () {
                $("#div1").fadeTo("slow", 0.15);
                $("#div2").fadeTo("slow", 0.4);
                $("#div3").fadeTo("slow", 0.7);
            });
        });
    </script>
</head>
<body>
    <button class="tombol1">Sembunyikan</button>
    <button class="tombol2">Tampilkan</button>
    <button class="tombol3">Fade Out</button>
    <button class="tombol4">Fade In</button>
    <button class="tombol5">Fade To</button>

    <br><br>

    <div id="div1"></div>
    <div id="div2"></div>
    <div id="div3"></div>
</body>
</html>
